name: ci

# The check on every push and pull request, and the plugin's zip as a build
# artefact.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shell, installers, plugin files, languages, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: scripts/check.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/unspike-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - uses: actions/upload-artifact@v7
        with:
          name: unspike-plugin
          path: dist/unspike-*.zip
          if-no-files-found: error
